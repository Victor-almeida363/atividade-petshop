<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutores | Amigo Fiel</title><link rel="stylesheet" href="/css/estilo.css"><script defer src="/js/clientes.js"></script></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">🐾</span>Amigo Fiel</a><span class="top-note">Cadastro de tutores</span></header><main class="container"><a class="back" href="/">← Voltar ao menu</a><div class="eyebrow">Cadastros</div><h1>Tutores</h1><p style="margin-bottom:24px">Mantenha os dados dos responsáveis pelos pets atualizados.</p>
<section class="panel"><div class="panel-heading"><div><h2>Novo tutor</h2><p>Nome e CPF são obrigatórios.</p></div></div><div id="mensagem" class="notice"></div>
<form id="form-cliente"><div class="form-grid"><div class="field"><label for="nome">Nome completo *</label><input id="nome" name="nome" required maxlength="100" placeholder="Ex.: Ana Souza"></div><div class="field"><label for="cpf">CPF *</label><input id="cpf" name="cpf" required maxlength="14" placeholder="000.000.000-00"></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" placeholder="(67) 99999-9999"></div><div class="field"><label for="endereco">Endereço</label><input id="endereco" name="endereco" placeholder="Rua, número, bairro"></div></div><div class="form-actions"><button class="btn" type="submit">＋ Cadastrar tutor</button></div></form></section>
<section class="panel"><div class="panel-heading"><div><h2>Tutores cadastrados</h2><p id="contador">Carregando registros…</p></div><button class="btn secondary" id="atualizar" type="button">↻ Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Endereço</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></body></html>
