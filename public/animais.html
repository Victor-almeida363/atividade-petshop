<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animais | Amigo Fiel</title><link rel="stylesheet" href="/css/estilo.css"><script defer src="/js/animais.js"></script></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">🐾</span>Amigo Fiel</a><span class="top-note">Cadastro de animais</span></header><main class="container"><a class="back" href="/">← Voltar ao menu</a><div class="eyebrow">Cadastros</div><h1>Animais</h1><p style="margin-bottom:24px">Cadastre os pets e vincule-os a um tutor existente.</p>
<section class="panel"><div class="panel-heading"><div><h2>Novo animal</h2><p>Escolha o tutor responsável pelo pet.</p></div></div><div id="mensagem" class="notice"></div><div id="aviso-tutor" class="notice"></div>
<form id="form-animal"><div class="form-grid"><div class="field"><label for="nome">Nome do animal *</label><input id="nome" name="nome" required placeholder="Ex.: Thor"></div><div class="field"><label for="cliente_id">Tutor *</label><select id="cliente_id" name="cliente_id" required><option value="">Carregando tutores…</option></select></div><div class="field"><label for="especie">Espécie *</label><select id="especie" name="especie" required><option value="">Selecione</option><option>Cachorro</option><option>Gato</option><option>Ave</option><option>Roedor</option><option>Réptil</option><option>Outra</option></select></div><div class="field"><label for="raca">Raça</label><input id="raca" name="raca" placeholder="Ex.: Labrador"></div><div class="field"><label for="data_nascimento">Data de nascimento</label><input id="data_nascimento" name="data_nascimento" type="date"></div></div><div class="form-actions"><button class="btn" type="submit">＋ Cadastrar animal</button></div></form></section>
<section class="panel"><div class="panel-heading"><div><h2>Animais cadastrados</h2><p id="contador">Carregando registros…</p></div><button class="btn secondary" id="atualizar" type="button">↻ Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>Animal</th><th>Espécie</th><th>Raça</th><th>Nascimento</th><th>Tutor</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></body></html>
