<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamentos | Amigo Fiel</title><link rel="stylesheet" href="/css/estilo.css"><script defer src="/js/agendamentos.js"></script></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">🐾</span>Amigo Fiel</a><span class="top-note">Agenda de serviços</span></header><main class="container"><a class="back" href="/">← Voltar ao menu</a><div class="eyebrow">Organização</div><h1>Agendamentos</h1><p style="margin-bottom:24px">Agende serviços e evite conflitos de horário.</p>
<section class="panel"><div class="panel-heading"><div><h2>Novo agendamento</h2><p>Não é permitido reservar um horário já ocupado.</p></div></div><div id="mensagem" class="notice"></div><form id="form-agendamento"><div class="form-grid"><div class="field"><label for="animal_id">Animal *</label><select id="animal_id" name="animal_id" required></select></div><div class="field"><label for="servico_id">Serviço *</label><select id="servico_id" name="servico_id" required></select></div><div class="field"><label for="data_hora">Data e hora *</label><input id="data_hora" name="data_hora" type="datetime-local" required></div><div class="field"><label for="leva_traz">Leva e traz</label><select id="leva_traz" name="leva_traz"><option value="false">Não</option><option value="true">Sim</option></select></div><div class="field full"><label for="observacao">Observação</label><textarea id="observacao" name="observacao" placeholder="Informações adicionais"></textarea></div></div><div class="form-actions"><button class="btn" type="submit">＋ Agendar serviço</button></div></form></section>
<section class="panel"><div class="panel-heading"><div><h2>Agenda</h2><p id="contador">Carregando agendamentos…</p></div><button class="btn secondary" id="atualizar" type="button">↻ Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>Data/hora</th><th>Animal</th><th>Tutor</th><th>Serviço</th><th>Preço</th><th>Leva e traz</th><th>Status</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></body></html>
